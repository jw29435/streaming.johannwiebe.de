<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>streaming.johannwiebe.de</title>
<!-- Die Seiten sind öffentlich, aber nichts, was in Suchmaschinen gehört. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="/icon.svg">
<style>
  :root {
    color-scheme: dark;
    --bg: #12141a; --panel: #1c1f27; --line: #2e3340;
    --text: #e8eaef; --muted: #9aa1b1; --accent: #4c8dff; --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  a.karte {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 10px;
    color: var(--text); text-decoration: none; min-height: 60px;
  }
  a.karte:hover { border-color: var(--accent); }
  a.karte b { font-size: 1.05rem; }
  a.karte .wo { color: var(--muted); font-size: 0.85rem; }
  .punkt { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .punkt.live { background: var(--ok); }
  footer { margin-top: 28px; color: var(--muted); font-size: 0.85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Übertragungen</h1>
  <p class="sub" id="sub">lädt …</p>
  <div id="liste"></div>

  <footer>
    <a href="/admin/regie">Regie</a> · <a href="/test">Testseite Phase 1</a>
  </footer>
</main>

<script type="module">
import { db, collection } from '/app/daten.js';
import { getDocs } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const liste = document.getElementById('liste');
const sub = document.getElementById('sub');

try {
  // public/* ist die einzige Sammlung ohne Anmeldung — genau dafür ist sie da.
  const s = await getDocs(collection(db, 'public'));
  const seiten = s.docs.map((d) => ({ id: d.id, ...d.data() }))
                       .sort((a, b) => a.id.localeCompare(b.id));

  sub.textContent = seiten.length
    ? 'Die Adressen bleiben gleich, egal welche Kamera gerade darauf läuft.'
    : 'Noch nichts eingerichtet — in der Regie einmal ein Preset schalten.';

  for (const seite of seiten) {
    const a = document.createElement('a');
    a.className = 'karte';
    a.href = '/' + seite.id;

    const punkt = document.createElement('span');
    punkt.className = 'punkt' + (seite.status === 'live' ? ' live' : '');

    const text = document.createElement('span');
    const name = document.createElement('b');
    name.textContent = seite.title || seite.id;
    const wo = document.createElement('div');
    wo.className = 'wo';
    wo.textContent = '/' + seite.id;
    text.append(name, wo);

    a.append(punkt, text);
    liste.appendChild(a);
  }
} catch (fehler) {
  sub.textContent = 'Übersicht nicht abrufbar: ' + fehler.message;
}
</script>
</body>
</html>
